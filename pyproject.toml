[project]
name = "sdr-surveytool"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "requests>=2.31",
    "bleak>=0.22",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.setuptools]
packages = [
    "schema",
    "capture",
    "capture.common",
    "capture.wifi",
    "capture.bluetooth",
    "ingest",
    "storage",
    "viz",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
