services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: surveytool
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (no default)}
      POSTGRES_DB: surveytool
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
